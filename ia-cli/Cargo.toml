[package]
name = "ia-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "ia"
path = "src/main.rs"

[dependencies]
ia-core = { path = "../ia-core" }
clap = { version = "4", features = ["derive", "env", "string"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
indicatif = "0.18"
console = "0.16"
comfy-table = "7.1"
libc = "0.2"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
urlencoding = "2"
chrono = "0.4"
clap_complete = "4.5.66"
color-print = "0.3"
rpassword = "5"
tempfile = "3"
rust_xlsxwriter = "0.79"
globset = "0.4"
indexmap = "2"

[features]
default = ["tui"]
tui = ["dep:ratatui", "dep:crossterm", "dep:open"]
self-update = []
alpha = ["ai-qa"]
ai-qa = []
ai-analyze = []

[dependencies.ratatui]
version = "0.30"
optional = true

[dependencies.crossterm]
version = "0.29"
optional = true

[dependencies.open]
version = "5"
optional = true

[dev-dependencies]
assert_cmd = "2"
filetime = "0.2"
predicates = "3"
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
wiremock = "0.6"
