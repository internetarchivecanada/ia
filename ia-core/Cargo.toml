[package]
name = "ia-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
bytes = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }
reqwest-middleware = { version = "0.5", features = ["json", "query", "form"] }
reqwest-retry = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "signal"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
configparser = "3"
thiserror = "2"
tracing = "0.1"
md-5 = "0.10"
sha1 = "0.10"
crc32fast = "1"
globset = "0.4"
chrono = { version = "0.4", features = ["serde"] }
urlencoding = "2"
http = "1"
httpdate = "1"
filetime = "0.2"
async-stream = "0.3"
async-trait = "0.1"
libc = "0.2"
json-patch = "3"
calamine = "0.26"
csv = "1"
rust_xlsxwriter = "0.79"
indexmap = { version = "2", features = ["serde"] }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util"] }
