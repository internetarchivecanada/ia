name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Run CI checks first — release only proceeds if all pass
  check:
    name: CI Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p ia-core -p ia-cli -- -D warnings
      - run: cargo doc --no-deps -p ia-core -p ia-cli
        env:
          RUSTDOCFLAGS: "-D warnings"

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: test-${{ matrix.os }}
      - run: cargo test -p ia-core -p ia-cli

  build:
    name: Build (${{ matrix.target }})
    needs: [check, test]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            binary: ia-cli
          - target: aarch64-apple-darwin
            os: macos-latest
            binary: ia-cli
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            binary: ia-cli.exe
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build release binary
        run: cargo build -p ia-cli --release --target ${{ matrix.target }} --features self-update

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ia-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ matrix.binary }}

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Rename binaries for release
        run: |
          mkdir -p release
          for dir in artifacts/ia-*/; do
            target=$(basename "$dir" | sed 's/^ia-//')
            if [ -f "$dir/ia-cli.exe" ]; then
              cp "$dir/ia-cli.exe" "release/ia-${target}.exe"
            elif [ -f "$dir/ia-cli" ]; then
              cp "$dir/ia-cli" "release/ia-${target}"
              chmod +x "release/ia-${target}"
            fi
          done

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/ia-*
