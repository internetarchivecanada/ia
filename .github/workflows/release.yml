name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # The release waits for the checks and for the tests on all three
  # platforms (the release job's `needs`). The builds start at once, in
  # parallel with them. The check job's cache is not saved: a cache saved
  # under a tag ref is never read again.
  check:
    name: CI Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p ia-core -p ia-cli -- -D warnings
      - run: cargo doc --no-deps -p ia-core -p ia-cli
        env:
          RUSTDOCFLAGS: "-D warnings"

  # The tests on ubuntu, macOS and Windows, restored from the cache that
  # every push to main keeps warm (the "Release platform tests" job in ci.yml).
  test:
    name: Test
    uses: ./.github/workflows/test.yml

  # The three release builds, restored from the cache that every push to main
  # saves under the same key (the "Release build" job in ci.yml).
  build:
    name: Build
    uses: ./.github/workflows/build.yml

  release:
    name: Release
    needs: [build, check, test]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Rename binaries for release
        run: |
          mkdir -p release
          for dir in artifacts/ia-*/; do
            target=$(basename "$dir" | sed 's/^ia-//')
            if [ -f "$dir/ia-cli.exe" ]; then
              cp "$dir/ia-cli.exe" "release/ia-${target}.exe"
            elif [ -f "$dir/ia-cli" ]; then
              cp "$dir/ia-cli" "release/ia-${target}"
              chmod +x "release/ia-${target}"
            fi
          done

      - name: Generate man pages
        run: |
          mkdir -p man
          ./release/ia-x86_64-unknown-linux-musl man --out-dir man
          tar -czf release/ia-cli-man.tar.gz -C man .

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/ia-*
