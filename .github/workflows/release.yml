name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # The release waits for the checks and for the tests on all three
  # platforms (the release job's `needs`). The builds start at once, in
  # parallel with them. The check job's cache is not saved: a cache saved
  # under a tag ref is never read again.
  check:
    name: CI Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 2026-10-16
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: false
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked -p ia-core -p ia-cli -- -D warnings
      - run: cargo doc --locked --no-deps -p ia-core -p ia-cli
        env:
          RUSTDOCFLAGS: "-D warnings"

  # The tests on ubuntu, macOS and Windows, restored from the cache that
  # every push to main keeps warm (the "Release platform tests" job in ci.yml).
  test:
    name: Test
    uses: ./.github/workflows/test.yml

  # The three release builds, restored from the cache that every push to main
  # saves under the same key (the "Release build" job in ci.yml).
  build:
    name: Build
    uses: ./.github/workflows/build.yml

  release:
    name: Release
    needs: [build, check, test]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
      # For the build provenance attestation (Sigstore, via GitHub).
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts

      - name: Rename binaries for release
        run: |
          mkdir -p release
          for dir in artifacts/ia-*/; do
            target=$(basename "$dir" | sed 's/^ia-//')
            if [ -f "$dir/ia-cli.exe" ]; then
              cp "$dir/ia-cli.exe" "release/ia-${target}.exe"
            elif [ -f "$dir/ia-cli" ]; then
              cp "$dir/ia-cli" "release/ia-${target}"
              chmod +x "release/ia-${target}"
            fi
          done

      - name: Generate man pages
        run: |
          mkdir -p man
          ./release/ia-x86_64-unknown-linux-musl man --out-dir man
          tar -czf release/ia-cli-man.tar.gz -C man .

      # SHA256SUMS lets a downloader check an asset with `sha256sum -c`.
      # The attestation records which workflow run built each asset;
      # `gh attestation verify <asset> --repo internetarchivecanada/ia`
      # checks it against GitHub's Sigstore log.
      - name: Write checksums
        working-directory: release
        run: sha256sum ia-* > SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: release/ia-*

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          files: |
            release/ia-*
            release/SHA256SUMS
