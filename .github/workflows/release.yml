name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # The checks and tests run on main for the same commit before it is tagged.
  # They run again here for the record; the build does not wait for them.
  check:
    name: CI Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p ia-core -p ia-cli -- -D warnings
      - run: cargo doc --no-deps -p ia-core -p ia-cli
        env:
          RUSTDOCFLAGS: "-D warnings"

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: test-${{ matrix.os }}
      - run: cargo test -p ia-core -p ia-cli

  # The three release builds, restored from the cache that every push to main
  # saves under the same key (the "Release build" job in ci.yml).
  build:
    name: Build
    uses: ./.github/workflows/build.yml

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Rename binaries for release
        run: |
          mkdir -p release
          for dir in artifacts/ia-*/; do
            target=$(basename "$dir" | sed 's/^ia-//')
            if [ -f "$dir/ia-cli.exe" ]; then
              cp "$dir/ia-cli.exe" "release/ia-${target}.exe"
            elif [ -f "$dir/ia-cli" ]; then
              cp "$dir/ia-cli" "release/ia-${target}"
              chmod +x "release/ia-${target}"
            fi
          done

      - name: Generate man pages
        run: |
          mkdir -p man
          ./release/ia-x86_64-unknown-linux-musl man --out-dir man
          tar -czf release/ia-cli-man.tar.gz -C man .

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/ia-*
