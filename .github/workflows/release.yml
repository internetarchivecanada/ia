name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            binary: ia
          - target: aarch64-apple-darwin
            os: macos-latest
            binary: ia
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            binary: ia.exe
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Run tests
        run: cargo test --workspace

      - name: Build release binary
        run: cargo build -p ia-cli --release --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ia-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ matrix.binary }}

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Rename binaries for release
        run: |
          for dir in artifacts/ia-*/; do
            target=$(basename "$dir" | sed 's/^ia-//')
            if [ -f "$dir/ia.exe" ]; then
              mv "$dir/ia.exe" "artifacts/ia-${target}.exe"
            elif [ -f "$dir/ia" ]; then
              mv "$dir/ia" "artifacts/ia-${target}"
              chmod +x "artifacts/ia-${target}"
            fi
          done

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/ia-*
            !artifacts/ia-*/
