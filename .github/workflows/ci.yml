name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Every action is pinned to a full commit SHA (the comment names the
# release it is), and every cargo command runs with --locked so a
# manifest that no longer matches Cargo.lock fails instead of silently
# re-resolving. Dependabot keeps the pins current (.github/dependabot.yml).
# The advisory scan lives in audit.yml so it can also run on a schedule.
jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 2026-10-16
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --locked -p ia-core -p ia-cli

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 2026-10-16
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --locked -p ia-core -p ia-cli -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 2026-10-16
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all -- --check

  doc:
    name: Doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 2026-10-16
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo doc --locked --no-deps -p ia-core -p ia-cli
        env:
          RUSTDOCFLAGS: "-D warnings"

  # Warm the release build cache: the same three builds release.yml runs,
  # saved under the key a tag's run restores. A tag's run can read caches
  # saved on main but never another tag's, so without this every release
  # build is cold. Pushes to main only; artifacts are not kept.
  release-build:
    name: Release build
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/build.yml
    with:
      upload-artifacts: false

  # Keep the release test caches warm the same way: the tests release.yml
  # waits for, on all three platforms, saved under the key a tag's run
  # restores. Pushes to main only.
  release-tests:
    name: Release platform tests
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/test.yml
