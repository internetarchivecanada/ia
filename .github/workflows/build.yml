name: Build release binaries

# Called by release.yml (on a tag) and by ci.yml (on every push to main).
# One definition, not two copies: Swatinem/rust-cache hashes the job's rustc
# version, its CARGO*/RUST* environment and the lockfiles into the cache key,
# so two hand-kept copies could drift apart and miss the cache with no error
# to show for it. A called workflow runs the same steps from both callers.
on:
  workflow_call:
    inputs:
      upload-artifacts:
        description: Upload each binary as a run artifact (the release job needs them; the warm-up on main does not)
        type: boolean
        default: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            binary: ia-cli
          - target: aarch64-apple-darwin
            os: macos-latest
            binary: ia-cli
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            binary: ia-cli.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 2026-10-16
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # The same key from main and from a tag. A workflow run can read
          # caches saved by its own ref and by the default branch, so the
          # push to main saves what the tag's run restores.
          shared-key: release-${{ matrix.target }}
          # A cache saved under a tag ref is never read again (no later tag
          # shares its scope), so only runs on main save.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build release binary
        run: cargo build --locked -p ia-cli --release --target ${{ matrix.target }}

      - name: Upload artifact
        if: inputs.upload-artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ia-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ matrix.binary }}
